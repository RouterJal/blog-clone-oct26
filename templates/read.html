{extends "._base.html"}

{% block content %}
    <h1>Blog de {{ post.author.username }}</h1>
    <ul>
        {% for publication in post_list %}
            <li>
                <a href="{% url 'post_detail' publication.pk %}">{{ publication.title }}</a>        
                <h2>{{ publication.title }}</h2>
                <p>{{ publication.content }}</p>
            </li>
        {% endfor %}
    </ul>

{% endblock %}
