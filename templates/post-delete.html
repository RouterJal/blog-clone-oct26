{% extends '_base.html' %}

{% block content %}
    <h2>Eliminar Post</h2>
    <p>¿Estás seguro de que deseas eliminar este post?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Eliminar</button>
        <a href="{% url 'post_detail' post.pk %}">Cancelar</a>
    </form>
{% endblock %}
